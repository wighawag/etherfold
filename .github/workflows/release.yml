name: release

# Changesets release flow (the "approve" flow):
#   1. Land PRs that include a changeset (`.changeset/*.md`) on main.
#   2. This workflow opens/updates a "Version Packages" PR that bumps versions
#      and writes changelogs from the pending changesets.
#   3. Merging that PR (which deletes the changesets) makes this workflow run
#      `release:ci`, which gates on the repo's own acceptance gate and then runs
#      `changeset publish`.
#
# Auth is npm Trusted Publishing (OIDC): NO NPM_TOKEN secret. npm trusts this
# repo + this workflow FILENAME once it is registered as a trusted publisher on
# each package. The handshake needs `id-token: write`, Node >= 22 and a pnpm
# that speaks OIDC; publishes are stamped with provenance automatically.
#
# THREE THINGS THIS WORKFLOW CANNOT DO FOR YOU, and each one fails as a
# misleading `E404` on publish rather than as itself:
#
#   1. A package must ALREADY EXIST on npm before a trusted publisher can be
#      registered for it. Every `@etherfold/*` package is unpublished, so the
#      FIRST publish of each has to come from a human (`pnpm release` at the
#      root, which is the same gate plus a local `changeset publish`). Only then
#      does this workflow have anything to authenticate against.
#   2. Each package needs a `repository` field in its package.json, pointing at
#      THIS repository. Trusted publishing generates provenance automatically,
#      and provenance is rejected when the declared repository does not match the
#      repository the workflow runs in.
#   3. The trusted publisher is registered against the workflow FILENAME
#      (`release.yml`, not `.github/workflows/release.yml`) and against
#      `owner/repo`. Renaming this file, or moving the repository, invalidates
#      every registration until they are updated.
#
# The Version PR also needs "Allow GitHub Actions to create and approve pull
# requests" enabled in Settings -> Actions -> General.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize release runs, and NEVER cancel one in flight: `changeset publish`
# may be mid-publish across ~18 packages, and cancelling it would leave the set
# half-published. Publishing is idempotent (a version already on npm is skipped),
# so letting every queued run finish is always safe.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm OIDC trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` here ON PURPOSE: the version comes from `packageManager` in
      # the root package.json, which pins it exactly and with an integrity hash.
      # Specifying both is an ERROR in pnpm/action-setup ("Multiple versions of
      # pnpm specified"), not a precedence rule, so the pin lives in exactly one
      # place. That it resolves to pnpm 10 matters twice over: the lockfile is v9
      # and pnpm 11 fails the install until every ignored build script is resolved
      # in pnpm-workspace.yaml, and `changeset publish` shells out to `pnpm
      # publish` in a pnpm workspace, where pnpm 11.0 regressed OIDC publishing to
      # a 404 (pnpm/pnpm#11513).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24 # >= 22 required for npm OIDC trusted publishing
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # MUST be v2 while @changesets/cli is v3, and the two are coupled in a way
      # that fails SILENTLY. v1 discovered what had been published by grepping the
      # publish command's stdout for `New tag: <pkg>@<ver>`; @changesets/cli v3
      # stopped printing that line, so v1 finds nothing published, skips pushing
      # tags AND creating GitHub releases, and still exits 0 (rocketh hit exactly
      # this: packages reached npm while its tags and releases silently stopped).
      # v2 reads structured JSON events instead.
      #
      # So: do not bump @changesets/cli across a major without checking this
      # action, and do not downgrade this action without downgrading the CLI.
      # And the CLI must stay >= 3: v2 bumps a 0.x package to 1.0.0 whenever a
      # package it peer-depends on takes a minor (see
      # scripts/check-no-major-graduation.mjs).
      - name: Create Version PR or publish
        # Pinned to a full commit SHA, not a tag: this is the step that publishes,
        # so it can reach the OIDC token, and a tag can be repointed. v2 is a
        # BRANCH upstream, so it moves with every v2.x release; this is v2.1.2.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # `release:ci` re-runs the acceptance gate and then publishes. The
          # action itself makes the git commit and the tags, so nothing here
          # pushes. No NPM_TOKEN: npm detects the OIDC environment and
          # authenticates as the registered trusted publisher. v2 dropped its own
          # .npmrc handling, which is fine because `setup-node` above sets
          # `registry-url`.
          publish-script: pnpm release:ci
          # `changeset:version` runs `changeset version`, then refuses to let a
          # pre-1.0 package graduate to 1.x (scripts/check-no-major-graduation.mjs),
          # so the Version PR is never opened with a version nobody chose. A 0.x
          # `minor` is fine: it stays 0.x.
          version-script: pnpm changeset:version
          # v2 REQUIRES the token as an input: it no longer reads the GITHUB_TOKEN
          # environment variable, nor the credentials `actions/checkout` configures.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # v2 changed the default to pushing commits/tags through the GitHub API.
          # Kept on the Git CLI, which is what v1 did here, so the upgrade changes
          # one thing at a time.
          push-with-git-cli: true
