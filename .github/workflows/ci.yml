# Formatting, build and tests on every push and pull request.
#
# Until this existed the only workflow was docs.yml, so nothing gated the suite:
# `format:check` was red on `main` for an unknown length of time and no one knew,
# because the only signal was someone remembering to run it locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same ref makes an in-flight run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` here ON PURPOSE: it comes from `packageManager` in the root
      # package.json. Specifying both is an ERROR in pnpm/action-setup ("Multiple
      # versions of pnpm specified"), not a precedence rule. It resolves to pnpm
      # 10, which is what this repo needs: the lockfile is v9, and pnpm 11 fails
      # the install until every ignored build script is resolved in
      # pnpm-workspace.yaml.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      # --frozen-lockfile also catches a package.json edited without regenerating
      # the lockfile, which is otherwise invisible until someone installs clean.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before build, so a formatting failure is reported as itself rather than
      # hiding behind a compile error.
      - name: Check formatting
        run: pnpm format:check

      # Two branches can each add an ADR-0032 and each be green on its own; the
      # collision exists only in the merge, which is why this runs here.
      - name: Check ADR numbering
        run: pnpm check:adr

      # A spec moving proposed -> tasked, or a task moving to done, is the workflow
      # working; it also breaks every citation of the old path, and nothing else in
      # this gate reads a path written in prose.
      - name: Check work/ references resolve
        run: pnpm check:refs

      # Front-runs `changeset status`, which is the authority but sits behind a full
      # install and build: a changeset naming a PRIVATE package beside a published
      # one is refused, and that one-line mistake used to cost an entire run. Kept
      # in step with `dorfl.json`'s gate deliberately -- see the note below on what
      # an asymmetry between the two runners costs.
      - name: Check changesets name published packages
        run: pnpm check:changesets

      # `prepare` already built during install; this re-runs it explicitly so a
      # build failure is attributed to the build rather than to installation.
      - name: Build packages and platforms
        run: pnpm build

      # THIS STEP IS LOAD-BEARING: it must not be dropped again.
      # `dorfl.json`'s acceptance gate runs `typecheck` and CI did not, and that
      # asymmetry is the whole mechanism by which 3143293 (which widened the root
      # `typecheck` filter to `examples/*`) passed its own PR and then left the
      # gate RED on `main` for two days, bouncing two unrelated tasks that had
      # nothing to do with examples. A gate step that only one of the two runners
      # executes is protecting nothing: whatever CI does not check, only a
      # dorfl-driven land checks, and plenty lands by other routes.
      # Runs AFTER build, deliberately: cross-package types resolve through each
      # package's `dist/`, so `typecheck` on an unbuilt tree reports missing
      # modules (CONTEXT.md, Conventions).
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The docs embed the demo, and the examples import the published packages,
      # so they are the closest thing to a consumer of this workspace.
      # The converse gap this used to leave open is CLOSED as of 2026-09-20:
      # `verify` now runs this too (it costs 3s), so an example whose `tsc` emit
      # breaks reds the gate instead of only reaching here.
      - name: Build examples
        run: pnpm build:examples

      # VitePress fails the build on a DEAD LINK, and until this step existed
      # nothing on a pull request ever ran it: `docs.yml` builds the site only on
      # a push to `main`, where it is a DEPLOY, so a broken link landed first and
      # broke the deploy afterwards. That is exactly what happened -- a spike
      # README linked `../../../work/notes/findings/...`, which is outside the
      # VitePress root, and `docs:build` was red on `main` from 00805ae until
      # someone happened to run it locally.
      #
      # It also belongs in `dorfl.json`'s `verify`, as of 2026-09-20, REVERSING
      # what this comment used to say. The old reasoning was that it is ~35s, needs
      # no per-task feedback, and catches a repo-wide failure rather than something
      # a single task's build agent can act on. The first is true (measured: ~22s
      # after `pnpm build`, which `verify` has already run) and the rest did not
      # survive contact.
      #
      # What defeated it: a red check HERE does not block the land path this repo
      # actually uses. Work is merged by the agent runner and its conductor, which
      # squash-merge without gating on a check run, so "CI will catch it" is only
      # true if someone reads CI. Nobody did -- `main` was red on ONE dead link
      # from a05ba3d5 (2026-09-18) through SEVEN merged PRs, and it took a
      # conductor bisecting an unrelated red to find it. That is the second time
      # this precise bug landed: the paragraph above records the first.
      #
      # A failure being repo-wide is also not a reason to keep it out of the gate.
      # It is a reason the gate should refuse it, because a repo-wide breakage that
      # only a deploy notices is strictly worse than one a build agent is told
      # about while it still owns the branch. The guide is user-facing product
      # documentation with copyable recipes in it, so a dead link is a broken
      # deliverable rather than cosmetic -- which argues for MORE gating, not less.
      #
      # Keeping it here too is deliberate: this is what covers the routes that do
      # not go through `verify` at all. See the observation
      # `mains-ci-has-been-red-since-pr-173-because-the-acceptance-gate-does-not-build-the-docs-site`.
      - name: Build docs site
        run: pnpm docs:build

  # THE REAL-BROWSER SUITES, which nothing ran before this job. They are kept out
  # of `pnpm test` (and so out of `dorfl.json`'s gate) on purpose, because they
  # need browser binaries a clean checkout does not have (ADR-0030). That left
  # them run only when someone remembered: the multi-tab election, the killed-
  # worker handover and the worker hosts were verified by hand in a throwaway
  # clone before merge, and every later change to them would have landed
  # unchecked. One job per engine, because what these suites assert is exactly
  # what engines disagree about (IndexedDB scheduling, Web Locks release on a
  # killed worker, what survives a reload), and `fail-fast: false` so one
  # engine's failure does not hide another's result.
  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The version comes from `packageManager`; see the note in `verify`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cross-package imports resolve through each package's `dist/`.
      - name: Build packages
        run: pnpm build

      - name: Install the browser
        run: pnpm --filter @etherfold/browser exec playwright install --with-deps ${{ matrix.browser }}

      - name: '@etherfold/browser (test:browser)'
        run: pnpm --filter @etherfold/browser exec playwright test --project=${{ matrix.browser }}

      - name: '@etherfold/state-store-indexeddb (test:browser)'
        run: pnpm --filter @etherfold/state-store-indexeddb exec playwright test --project=${{ matrix.browser }}

      # The reference declares one project (chromium): the file the guide tells
      # readers to copy, run against an injected wallet and chain, offline.
      - name: browser-reference (verify:browser)
        if: matrix.browser == 'chromium'
        run: pnpm --filter browser-reference verify:browser
